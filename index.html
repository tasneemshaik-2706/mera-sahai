<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mera Sahai</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="#">Mera Sahai</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="#jobs">Opportunities</a>
        <a class="nav-link" href="#join">Join</a>
      </div>
    </div>
  </nav>

  <header class="hero text-center">
    <div class="container">
      <h1>Connecting talent with opportunity</h1>
      <p class="lead">Job seekers, entrepreneurs and companies, together in one place.</p>
      <a href="#join" class="btn btn-light btn-lg">Get started</a>
    </div>
  </header>

  <section id="jobs" class="container py-5">
    <h2 class="mb-3">Opportunities</h2>
    <input id="search" class="form-control mb-4" placeholder="Search jobs and internships">
    <div class="row" id="job-list">
      <div class="col-md-4 job" data-type="internship"><div class="card p-3"><h5>Web Development Intern</h5><p>Internship</p></div></div>
      <div class="col-md-4 job" data-type="job"><div class="card p-3"><h5>Junior Python Developer</h5><p>Full-time</p></div></div>
      <div class="col-md-4 job" data-type="internship"><div class="card p-3"><h5>Cybersecurity Intern</h5><p>Internship</p></div></div>
    </div>
  </section>

  <section id="join" class="bg-light py-5">
    <div class="container" style="max-width: 520px;">
      <h2 class="mb-3">Join Mera Sahai</h2>
      <form id="signup-form" action="register.php" method="post" novalidate>
        <div class="mb-3"><label class="form-label">Full name</label><input name="name" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" minlength="8" required></div>
        <div class="mb-3">
          <label class="form-label">I am a</label>
          <select name="role" class="form-select">
            <option value="job_seeker">Job seeker</option>
            <option value="entrepreneur">Entrepreneur</option>
            <option value="company">Company</option>
          </select>
        </div>
        <div id="form-error" class="text-danger mb-2"></div>
        <button class="btn btn-primary w-100" type="submit">Sign up</button>
      </form>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
